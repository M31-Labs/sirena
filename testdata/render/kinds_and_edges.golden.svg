.edge.kind-subscribes path { stroke: var(--sirena-edge-stroke-subscribes); }
.edge.kind-depends_on path { stroke: var(--sirena-edge-stroke-depends-on); }
.label path { fill: var(--sirena-label-fill); stroke: none; }
</style>
